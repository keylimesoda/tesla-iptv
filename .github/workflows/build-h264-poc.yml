name: build-h264-poc

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-h264-poc.yml"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "src/**"
      - "public/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tesla-iptv
        uses: actions/checkout@v4

      - name: Restore libav worker frame layout compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/wasm-player.ts")
          text = path.read_text()
          old = 'copyoutFrame: "video_packed",'
          new = 'copyoutFrame: "video",'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY

          # libav.js worker mode is not returning layout metadata for the packed
          # frame path on the deployed runtime. Persist the known-good frame
          # representation to main as well as using it for this build.
          if ! git diff --quiet -- src/wasm-player.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/wasm-player.ts
            git commit -m "fix: restore YUV frame layout from libav worker [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install app dependencies
        run: npm ci

      - name: Type-check app
        run: npx tsc --noEmit

      - name: Build Vite app
        run: npm run build

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: "6.0.5"
          actions-cache-folder: "cache-emsdk"

      - name: Install libav build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson pkg-config ffmpeg

      - name: Fetch pinned libav.js
        run: |
          git clone https://github.com/Yahweasel/libav.js.git libavjs
          cd libavjs
          git checkout c05a676d16c1068cce6115594858c50a7ecad4b8

      - name: Create HLS H.264 variant
        working-directory: libavjs
        run: |
          cd configs
          ./mkconfig.js h264-poc '["avformat","avcodec","protocol-jsfetch","demuxer-hls","demuxer-mpegts","demuxer-mp4","parser-h264","decoder-h264"]'

      - name: Build H.264 WebAssembly target
        working-directory: libavjs
        run: |
          make -j2 \
            dist/libav-6.10.9.0-h264-poc.js \
            dist/libav-6.10.9.0-h264-poc.wasm.js
          test -f dist/libav-6.10.9.0-h264-poc.wasm.wasm

      - name: Prepare libav runtime and diagnostic asset
        run: |
          mkdir -p publish/libav-h264
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "testsrc2=size=640x360:rate=30" \
            -t 4 -an -c:v libx264 -preset veryfast \
            -profile:v baseline -level 3.0 -pix_fmt yuv420p \
            -movflags +faststart \
            publish/libav-h264/sample-h264.mp4
          cp libavjs/dist/libav-6.10.9.0-h264-poc.js publish/libav-h264/
          cp libavjs/dist/libav-6.10.9.0-h264-poc.wasm.js publish/libav-h264/
          cp libavjs/dist/libav-6.10.9.0-h264-poc.wasm.wasm publish/libav-h264/

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Publish app and WASM runtime
        run: |
          rm -rf site/assets site/libav-h264
          cp -a dist/. site/
          mkdir -p site/libav-h264
          cp publish/libav-h264/* site/libav-h264/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build: publish IPTV WASM beta"
            git push origin gh-pages
          fi
